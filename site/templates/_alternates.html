  <link rel="canonical" href="{{ base_url }}{{ path }}">

  <link rel="alternate" hreflang="{{ l }}" href="{{ base_url }}{{ alternates[l] }}">
{% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ base_url }}{{ alternates[default_lang] }}">
