# Landing de Hilbert. La interfaz de la app está en español; las versiones
# en inglés y alemán lo dicen. Hilbert detecta referencias en libros en
# inglés y español (no en alemán).

[meta.title]
es = "Hilbert — El lector de PDF para estudiar física y matemáticas"
en = "Hilbert — The PDF reader for studying physics and math"
de = "Hilbert — Der PDF-Reader, um Physik und Mathematik zu studieren"

[meta.description]
es = "Hilbert es un lector de PDF nativo para macOS pensado para libros de física y matemáticas: vista previa de ecuaciones, referencias inteligentes, notas en LaTeX, OCR en el dispositivo y Claude opcional."
en = "Hilbert is a native macOS PDF reader built for physics and math books: equation previews, smart references, LaTeX notes, on-device OCR and optional Claude."
de = "Hilbert ist ein nativer PDF-Reader für macOS, gemacht für Physik- und Mathebücher: Gleichungsvorschau, intelligente Verweise, LaTeX-Notizen, OCR auf dem Gerät und optional Claude."

[meta.og]
es = "Vista previa de ecuaciones al pasar el ratón, resaltados por categoría, notas en Markdown + LaTeX y Claude para explicar."
en = "Equation previews on hover, highlights by category, Markdown + LaTeX notes and Claude to explain."
de = "Gleichungsvorschau beim Darüberfahren, Markierungen nach Kategorie, Notizen in Markdown + LaTeX und Claude als Erklärer."

