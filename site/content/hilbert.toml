[claude.snippet]
es = "Recorte · p. 88"
en = "Snippet · p. 88"
de = "Ausschnitt · S. 88"

[claude.answer]
es = '''Es el hamiltoniano del oscilador armónico escrito con operadores escalera. El <span data-tex="\tfrac12"></span> es la energía de punto cero: incluso el estado fundamental tiene energía <span data-tex="\hbar\omega/2"></span>.'''
en = '''This is the harmonic oscillator Hamiltonian written with ladder operators. The <span data-tex="\tfrac12"></span> is the zero-point energy: even the ground state has energy <span data-tex="\hbar\omega/2"></span>.'''
de = '''Das ist der Hamiltonoperator des harmonischen Oszillators, geschrieben mit Leiteroperatoren. Das <span data-tex="\tfrac12"></span> ist die Nullpunktsenergie: Selbst der Grundzustand hat die Energie <span data-tex="\hbar\omega/2"></span>.'''

