# ---------- Funciones ----------
[features.title]
es = "Un control de verdad, <span>no una rejilla de botones</span>."
en = "A real remote, <span>not a grid of buttons</span>."
de = "Eine echte Fernbedienung, <span>kein Raster aus Knöpfen</span>."

[features.gallery_alts]
es = ["Zapper en modo oscuro", "Zapper en modo claro", "Teclado numérico"]
en = ["Zapper in dark mode", "Zapper in light mode", "Number pad"]
de = ["Zapper im dunklen Modus", "Zapper im hellen Modus", "Ziffernblock"]

[[features.entries]]
icon = "🎛"
[features.entries.title]
es = "Control completo"
en = "The full remote"
de = "Die komplette Fernbedienung"
[features.entries.text]
es = "Encendido, fuente, cruceta, atrás, inicio, reproducir y pausar, volumen, canales, teclado numérico y las apps de tu TV a un clic."
en = "Power, source, a directional pad, back, home, play and pause, volume, channels, a number pad and your TV's own apps one click away."
de = "Ein/Aus, Quelle, Steuerkreuz, Zurück, Home, Wiedergabe und Pause, Lautstärke, Kanäle, Ziffernblock und die Apps deines Fernsehers mit einem Klick."

[[features.entries]]
icon = "⌨️"
[features.entries.title]
es = "Pensado para el teclado"
en = "Keyboard-first"
de = "Für die Tastatur gemacht"
[features.entries.text]
es = "Las flechas mueven, Retorno selecciona, Esc vuelve y Espacio reproduce y pausa. Las teclas se repiten al mantenerlas."
en = "Arrow keys move, Return selects, Esc goes back and Space plays and pauses. Hold a key and it repeats."
de = "Pfeiltasten bewegen, Return wählt aus, Esc geht zurück, die Leertaste spielt und pausiert. Gedrückt halten wiederholt."

[[features.entries]]
icon = "📍"
[features.entries.title]
es = "En la barra de menús"
en = "In the menu bar"
de = "In der Menüleiste"
[features.entries.text]
es = "Un mini control con lo esencial, a un clic mientras trabajas."
en = "A mini remote with the essentials, one click away while you work."
de = "Eine Mini-Fernbedienung mit dem Wichtigsten, einen Klick entfernt, während du arbeitest."

[[features.entries]]
icon = "🔤"
[features.entries.title]
es = "Escribe en el TV"
en = "Type on your TV"
de = "Auf dem Fernseher tippen"
[features.entries.text]
es = "Busca en YouTube o Netflix con el teclado del Mac en vez de picotear un teclado en pantalla."
en = "Search YouTube or Netflix from your Mac keyboard instead of pecking at an on-screen keyboard."
de = "Such auf YouTube oder Netflix mit der Mac-Tastatur, statt auf einer Bildschirmtastatur herumzupicken."

[[features.entries]]
icon = "🔌"
[features.entries.title]
es = "Se mantiene conectado"
en = "Stays connected"
de = "Bleibt verbunden"
[features.entries.text]
es = "Se reconecta solo al despertar el Mac, al reiniciar el TV o si el router le cambia la IP, sin perder pulsaciones."
en = "It reconnects by itself when your Mac wakes, when the TV restarts or when the router gives it a new IP, without losing key presses."
de = "Verbindet sich selbst neu, wenn der Mac aufwacht, der Fernseher neu startet oder der Router ihm eine neue IP gibt, ohne Tastendrücke zu verlieren."

[[features.entries]]
icon = "⚡️"
[features.entries.title]
es = "Enciende el televisor"
en = "Turns the TV on"
de = "Schaltet den Fernseher ein"
[features.entries.text]
es = "Con Wake-on-LAN, Zapper despierta un televisor que está en reposo."
en = "With Wake-on-LAN, Zapper can wake a TV that's in standby."
de = "Mit Wake-on-LAN weckt Zapper einen Fernseher aus dem Standby."

# ---------- Configuración ----------
[setup.eyebrow]
es = "Configuración"
en = "Setup"
de = "Einrichtung"

[setup.title]
es = "De la caja al sofá <span>en menos de un minuto</span>."
en = "From download to sofa <span>in under a minute</span>."
de = "Vom Download aufs Sofa <span>in unter einer Minute</span>."

[setup.steps]
es = [["Abre Zapper", "Una bienvenida corta, sin crear cuentas."], ["Elige tu televisor", "Zapper lo busca por SSDP y escanea tu subred. Si tu router aísla dispositivos, escribes la IP."], ["Apruébalo en el TV", "Una sola vez. La clave de emparejamiento se guarda solo en tu Mac."]]
en = [["Open Zapper", "A short welcome, no account to create."], ["Pick your TV", "Zapper finds it via SSDP and scans your subnet. If your router isolates devices, you type in the IP."], ["Approve it on the TV", "Just once. The pairing key is stored only on your Mac."]]
de = [["Zapper öffnen", "Eine kurze Begrüßung, kein Konto nötig."], ["Fernseher wählen", "Zapper findet ihn per SSDP und durchsucht dein Subnetz. Isoliert dein Router Geräte, gibst du die IP ein."], ["Am Fernseher bestätigen", "Nur ein einziges Mal. Der Kopplungsschlüssel wird nur auf deinem Mac gespeichert."]]

[setup.alts]
es = ["Bienvenida", "Elegir televisor", "Aprobar en el televisor", "Control en la barra de menús"]
en = ["Welcome", "Choose your TV", "Approve on the TV", "Menu bar remote"]
de = ["Willkommen", "Fernseher wählen", "Am Fernseher bestätigen", "Fernbedienung in der Menüleiste"]

