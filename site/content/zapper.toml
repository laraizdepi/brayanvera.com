[shortcuts.requirements]
es = "Requisitos: un Mac con macOS 13 Ventura o posterior y un Samsung Smart TV con Tizen, de 2016 o más reciente, en la misma red. Para encender el TV desde Zapper, activa en el televisor <i>Ajustes › General › Red › Ajustes expertos › Encender con móvil</i>."
en = "Requirements: a Mac with macOS 13 Ventura or later and a Samsung Smart TV running Tizen, 2016 or newer, on the same network. To turn the TV on from Zapper, enable <i>Settings › General › Network › Expert Settings › Power On with Mobile</i> on the TV."
de = "Voraussetzungen: ein Mac mit macOS 13 Ventura oder neuer und ein Samsung Smart TV mit Tizen, ab Baujahr 2016, im selben Netzwerk. Damit Zapper den Fernseher einschalten kann, aktiviere am Fernseher <i>Einstellungen › Allgemein › Netzwerk › Experteneinstellungen › Mit Mobilgerät einschalten</i>."

[shortcuts.privacy]
es = '''<b style="color:var(--text-2)">Privacidad.</b> Zapper solo habla con tu televisor, dentro de tu red. Sin cuentas, sin analíticas, sin informes de errores y sin servidores.'''
en = '''<b style="color:var(--text-2)">Privacy.</b> Zapper talks only to your TV, on your own network. No account, no analytics, no crash reporting and no servers.'''
de = '''<b style="color:var(--text-2)">Datenschutz.</b> Zapper spricht nur mit deinem Fernseher, in deinem eigenen Netzwerk. Kein Konto, keine Analytics, keine Absturzberichte, keine Server.'''

