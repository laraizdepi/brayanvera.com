en = [["Move", "Volume up / down"], ["OK", "Mute"], ["Back", "Channel up / down"], ["Play / pause", "Channel digits"], ["Home", "Info"], ["Source", "Turn the TV on / off"], ["Type on the TV", "Show all shortcuts"]]
