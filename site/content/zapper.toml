# ---------- Por qué ----------
[why.eyebrow]
es = "Por qué"
en = "Why"
de = "Warum"

[why.title]
es = "El control siempre está en la otra habitación.<br><span>Tu Mac no.</span>"
en = "Your TV remote is always in the other room.<br><span>Your Mac isn't.</span>"
de = "Die Fernbedienung liegt immer im anderen Zimmer.<br><span>Dein Mac nicht.</span>"

[why.lead]
es = "Las apps de control remoto para Mac suelen ser apps de iPhone estiradas o están abandonadas. Zapper está hecho para el Mac desde la primera línea: SwiftUI, sin vistas web, sin anuncios y sin cuentas."
en = "Remote apps on the Mac tend to be stretched-out iPhone apps or long abandoned. Zapper is built for the Mac from the first line: SwiftUI, no web views, no ads and no account."
de = "Fernbedienungs-Apps für den Mac sind meist aufgeblähte iPhone-Apps oder längst aufgegeben. Zapper ist von der ersten Zeile an für den Mac gebaut: SwiftUI, keine Web-Views, keine Werbung, kein Konto."

