# ---------- Escena de dos pantallas ----------
[mock.subject]
es = "MECÁNICA CUÁNTICA"
en = "QUANTUM MECHANICS"
de = "QUANTENMECHANIK"

[mock.note_running]
es = "3 de 4 · racha de 7 días"
en = "3 of 4 · 7-day streak"
de = "3 von 4 · 7-Tage-Serie"

[mock.note_done]
es = "Meta cumplida · racha de 8 días"
en = "Goal reached · 8-day streak"
de = "Ziel erreicht · 8-Tage-Serie"

[mock.heading]
es = "4.2 El oscilador armónico cuántico"
en = "4.2 The quantum harmonic oscillator"
de = "4.2 Der quantenmechanische harmonische Oszillator"

[mock.p1]
es = "Consideremos una partícula de masa m sujeta a un potencial cuadrático. Introduciendo los operadores de creación y aniquilación, el hamiltoniano adopta una forma particularmente simple."
en = "Consider a particle of mass m in a quadratic potential. Introducing the creation and annihilation operators, the Hamiltonian takes a particularly simple form."
de = "Betrachten wir ein Teilchen der Masse m in einem quadratischen Potential. Mit den Erzeugungs- und Vernichtungsoperatoren nimmt der Hamiltonoperator eine besonders einfache Form an."

[mock.p2]
es = "Los autovalores de la energía resultan equiespaciados, separados por ħω, y el estado fundamental posee una energía no nula: la energía de punto cero."
en = "The energy eigenvalues turn out to be equally spaced, separated by ħω, and the ground state has non-zero energy: the zero-point energy."
de = "Die Energieeigenwerte sind äquidistant mit Abstand ħω, und der Grundzustand hat eine von null verschiedene Energie: die Nullpunktsenergie."

[mock.p3]
es = "Este resultado reaparece en la teoría cuántica de campos, donde cada modo del campo se comporta como un oscilador independiente."
en = "This result reappears in quantum field theory, where each mode of the field behaves like an independent oscillator."
de = "Dieses Ergebnis taucht in der Quantenfeldtheorie wieder auf, wo sich jede Mode des Feldes wie ein unabhängiger Oszillator verhält."

# ---------- Por qué existe ----------
[why.eyebrow]
es = "Por qué existe"
en = "Why it exists"
de = "Warum es sie gibt"

[why.title]
es = "Nació de un problema <span>concreto</span>."
en = "Born from a <span>real</span> problem."
de = "Entstanden aus einem <span>konkreten</span> Problem."

[why.lead]
es = "Estudiar con un MacBook conectado a un monitor externo: el material en la pantalla grande y la del portátil dedicada solo al reloj. Productity cuenta lo que estudias con la técnica pomodoro sin interponerse."
en = "Studying with a MacBook hooked up to an external monitor: the material on the big screen and the laptop screen dedicated only to the clock. Productity tracks what you study with the Pomodoro technique without getting in the way."
de = "Lernen mit einem MacBook am externen Monitor: das Material auf dem großen Bildschirm, der Laptop-Bildschirm nur für die Uhr. Productity zählt mit der Pomodoro-Technik, was du lernst, ohne dir in die Quere zu kommen."

[why.points]
es = ["<b>Bloques de 45 minutos</b> por defecto, no los 25 clásicos, con descansos cortos y largos.", "<b>Reloj a pantalla completa</b> en el monitor que elijas, tapando la barra de menús y el Dock sin quitarte el foco del teclado.", "<b>Anota en qué trabajaste</b> en cada bloque, desde la app o desde el propio aviso."]
en = ["<b>45-minute blocks</b> by default, not the classic 25, with short and long breaks.", "<b>A full-screen clock</b> on the monitor you choose, covering the menu bar and Dock without taking keyboard focus away from you.", "<b>Note what you worked on</b> in each block, from the app or right from the notification."]
de = ["<b>45-Minuten-Blöcke</b> als Standard, nicht die klassischen 25, mit kurzen und langen Pausen.", "<b>Vollbilduhr</b> auf dem Monitor deiner Wahl, über Menüleiste und Dock, ohne dir den Tastaturfokus zu nehmen.", "<b>Notiere, woran du gearbeitet hast</b>, in jedem Block, in der App oder direkt in der Mitteilung."]

[why.alt]
es = "Pantalla Hoy de Productity"
en = "Productity's Today screen"
de = "Heute-Ansicht von Productity"

# ---------- Funciones ----------
[features.title]
es = "Todo lo necesario para <span>no romper la racha</span>."
en = "Everything you need to <span>keep the streak alive</span>."
de = "Alles, was du brauchst, damit <span>die Serie hält</span>."

[[features.entries]]
icon = "⏱"
[features.entries.title]
es = "Bloques a tu medida"
en = "Blocks your way"
de = "Blöcke nach Maß"
[features.entries.text]
es = "25, 45, 50, 60 o 90 minutos. La cuenta atrás usa marcas de tiempo absolutas: no se desvía si el Mac se suspende."
en = "25, 45, 50, 60 or 90 minutes. The countdown uses absolute timestamps, so it doesn't drift when the Mac sleeps."
de = "25, 45, 50, 60 oder 90 Minuten. Der Countdown nutzt absolute Zeitstempel und läuft nicht davon, wenn der Mac schläft."

[[features.entries]]
icon = "🌊"
[features.entries.title]
es = "Tiempo extra en racha"
en = "Overtime when you're on a roll"
de = "Verlängerung im Flow"
[features.entries.text]
es = "Al acabar el bloque suena la campana, pero el reloj sigue, y lo que estudies de más se suma al bloque."
en = "When the block ends the bell rings, but the clock keeps going, and whatever extra you study is added to the block."
de = "Am Ende des Blocks läutet die Glocke, aber die Uhr läuft weiter, und was du länger lernst, zählt zum Block."

[[features.entries]]
icon = "🖥"
[features.entries.title]
es = "Pantalla completa sin robar el foco"
en = "Full screen without stealing focus"
de = "Vollbild, ohne den Fokus zu stehlen"
[features.entries.text]
es = "El reloj ocupa la pantalla que elijas y la recuerda aunque desconectes el monitor."
en = "The clock takes over the screen you choose and remembers it even if you unplug the monitor."
de = "Die Uhr belegt den Bildschirm deiner Wahl und merkt ihn sich, auch wenn du den Monitor trennst."

[[features.entries]]
icon = "🎯"
[features.entries.title]
es = "Metas por día"
en = "Goals for each day"
de = "Ziele für jeden Tag"
[features.entries.text]
es = "Más pomodoros los días libres y menos los días cargados de clase. Cambiarlas no reescribe el pasado."
en = "More Pomodoros on free days and fewer on days packed with classes. Changing them doesn't rewrite the past."
de = "Mehr Pomodoros an freien Tagen, weniger an vollen Unitagen. Änderungen schreiben die Vergangenheit nicht um."

[[features.entries]]
icon = "🔥"
[features.entries.title]
es = "Racha con protectores"
en = "Streaks with shields"
de = "Serie mit Schutzschilden"
[features.entries.text]
es = "Cada semana completa te da un protector que salva la racha en un día flojo. Puedes guardar hasta dos."
en = "Every complete week earns you a shield that saves your streak on a slow day. You can keep up to two."
de = "Jede vollständige Woche bringt dir einen Schutz, der deine Serie an einem schwachen Tag rettet. Du kannst bis zu zwei sammeln."

[[features.entries]]
icon = "🗓"
[features.entries.title]
es = "Horario de clases"
en = "Class schedule"
de = "Stundenplan"
[features.entries.text]
es = "Conectado con tus materias: te avisa cuándo ponerte a estudiar y puede ajustar tus metas solo."
en = "Linked to your subjects: it tells you when to start studying and can adjust your goals on its own."
de = "Mit deinen Fächern verknüpft: Er sagt dir, wann du loslegen solltest, und kann deine Ziele selbst anpassen."

[[features.entries]]
icon = "📊"
[features.entries.title]
es = "Historial que motiva"
en = "History that motivates"
de = "Verlauf, der motiviert"
[features.entries.text]
es = "Mapa de actividad del último año, los últimos siete días frente a la meta y el reparto por materia."
en = "An activity map of the past year, the last seven days against your goal and the breakdown by subject."
de = "Aktivitätskarte des letzten Jahres, die letzten sieben Tage im Vergleich zum Ziel und die Verteilung nach Fach."

[[features.entries]]
icon = "📝"
[features.entries.title]
es = "Sesiones corregibles"
en = "Editable sessions"
de = "Korrigierbare Sitzungen"
[features.entries.text]
es = "¿Olvidaste poner el reloj? Apunta la sesión a mano o corrige la materia, la hora o la duración."
en = "Forgot to start the clock? Log the session by hand or fix the subject, time or duration."
de = "Uhr vergessen? Trag die Sitzung von Hand ein oder korrigiere Fach, Uhrzeit oder Dauer."

[[features.entries]]
icon = "🌙"
[features.entries.title]
es = "Días que cuentan bien"
en = "Days that count right"
de = "Tage, die richtig zählen"
[features.entries.text]
es = "La jornada empieza a las 4:00, así que estudiar a la una de la madrugada cuenta para el día anterior."
en = "The day starts at 4:00 a.m., so studying at 1 a.m. counts toward the previous day."
de = "Der Tag beginnt um 4:00 Uhr, also zählt Lernen um ein Uhr nachts zum Vortag."

# ---------- Bloques con capturas (se alternan izquierda/derecha) ----------
[[blocks]]
image = "tiempo-extra.png"
[blocks.eyebrow]
