de = "Wenn du im Flow bist, <span>unterbricht dich die Uhr nicht</span>."
[blocks.lead]
es = "Al llegar a cero suena y el reloj pasa a «+03:12». El pomodoro ya cuenta, y los minutos de más se suman al bloque cuando pasas al descanso, con un tope configurable."
en = "At zero it chimes and the clock switches to “+03:12”. The Pomodoro already counts, and the extra minutes are added to the block when you take your break, up to a limit you set."
de = "Bei null ertönt ein Signal und die Uhr wechselt zu „+03:12“. Der Pomodoro zählt schon, und die zusätzlichen Minuten werden dem Block beim Wechsel in die Pause gutgeschrieben, bis zu einer einstellbaren Grenze."
