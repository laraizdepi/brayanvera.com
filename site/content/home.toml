en = "AI inside the apps"
de = "KI in den Apps"

[ai.apps]
es = "En <a href=\"{{ url('hilbert') }}\">Hilbert</a>, Claude explica una selección, un recorte o una página entera, y transcribe a LaTeX una ecuación recortada. Es opcional: sin una API key, la app funciona igual."
en = "In <a href=\"{{ url('hilbert') }}\">Hilbert</a>, Claude explains a selection, a snippet or a whole page, and transcribes a cropped equation into LaTeX. It's optional: without an API key, the app works just the same."
de = "In <a href=\"{{ url('hilbert') }}\">Hilbert</a> erklärt Claude eine Auswahl, einen Ausschnitt oder eine ganze Seite und überträgt eine ausgeschnittene Gleichung in LaTeX. Das ist optional: Ohne API-Key funktioniert die App genauso."

[ai.stack]
es = "<b>Pila.</b> Python, FastAPI, SQLite, Stockfish, la API de Claude y Swift."
en = "<b>Stack.</b> Python, FastAPI, SQLite, Stockfish, the Claude API and Swift."
de = "<b>Stack.</b> Python, FastAPI, SQLite, Stockfish, die Claude-API und Swift."

[ai.pinns]
es = "También exploré las redes neuronales informadas por la física (PINNs) en un proyecto corto. Me sirvió más como ejercicio que como línea de trabajo."
en = "I also explored physics-informed neural networks (PINNs) in a short project. It was more useful to me as an exercise than as a line of work."
de = "In einem kurzen Projekt habe ich außerdem physikinformierte neuronale Netze (PINNs) ausprobiert. Als Übung hat es mir mehr gebracht denn als Forschungsrichtung."

