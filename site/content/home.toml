# ---------- §2 Inteligencia artificial ----------
[ai.heading]
es = "Inteligencia artificial"
en = "Artificial intelligence"
de = "Künstliche Intelligenz"

[ai.lede]
es = "Uso la IA como lo que es: una herramienta potentísima que a veces se equivoca. Por eso todo lo que construyo sigue la misma regla de diseño: el modelo no inventa números."
en = "I use AI for what it is: an incredibly powerful tool that is sometimes wrong. That's why everything I build follows the same design rule: the model doesn't make up numbers."
de = "Ich nutze KI als das, was sie ist: ein enorm mächtiges Werkzeug, das sich manchmal irrt. Deshalb folgt alles, was ich baue, derselben Designregel: Das Modell erfindet keine Zahlen."

[ai.chesscoach]
es = "Analiza mis partidas de ajedrez con Stockfish y atribuye cada punto de probabilidad de ganar que pierdo a <em>una sola</em> causa: táctica permitida, táctica no vista, apertura, final, medio juego o reloj. Así el reparto suma 100 % y nada se cuenta dos veces. Reporta tasas con intervalos de confianza, avisa cuando la muestra es pequeña y me entrena con mis propios errores mediante repetición espaciada (FSRS). El modelo de lenguaje solo redacta el plan semanal, y su texto se valida: si inventa un número o un enlace, se descarta."
en = "It analyzes my chess games with Stockfish and assigns every point of win probability I lose to <em>a single</em> cause: a tactic I allowed, a tactic I missed, the opening, the endgame, the middlegame or the clock. That way the breakdown adds up to 100% and nothing is counted twice. It reports rates with confidence intervals, warns me when the sample is small, and trains me on my own mistakes with spaced repetition (FSRS). The language model only writes the weekly plan, and its text is checked: if it invents a number or a link, it gets thrown out."
de = "Es analysiert meine Schachpartien mit Stockfish und ordnet jeden Prozentpunkt Gewinnwahrscheinlichkeit, den ich verliere, <em>genau einer</em> Ursache zu: einer zugelassenen Taktik, einer übersehenen Taktik, der Eröffnung, dem Endspiel, dem Mittelspiel oder der Uhr. So summiert sich die Aufteilung auf 100 % und nichts wird doppelt gezählt. Es gibt Raten mit Konfidenzintervallen an, warnt bei kleinen Stichproben und trainiert mich mit meinen eigenen Fehlern per verteilter Wiederholung (FSRS). Das Sprachmodell formuliert nur den Wochenplan, und sein Text wird geprüft: Erfindet es eine Zahl oder einen Link, wird er verworfen."

[ai.pipeline_label]
es = "Flujo de chesscoach"
en = "chesscoach pipeline"
de = "Ablauf von chesscoach"

[ai.lexiread]
es = "Un lector para aprender idiomas. Antes de empezar un texto, estima qué palabras te faltan para entenderlo por completo. Al tocar una palabra, Claude la traduce tal como se usa en <em>esa</em> frase, con una explicación y un ejemplo nuevo. Las palabras desconocidas pasan a tarjetas de repaso espaciado."
en = "A reader for learning languages. Before you start a text, it estimates which words you're missing to understand it completely. Tap a word and Claude translates it the way it's used in <em>that</em> sentence, with an explanation and a fresh example. Unknown words become spaced-repetition flashcards."
de = "Ein Lesewerkzeug zum Sprachenlernen. Bevor du einen Text beginnst, schätzt es, welche Wörter dir noch fehlen, um ihn vollständig zu verstehen. Tippst du auf ein Wort, übersetzt Claude es so, wie es in <em>diesem</em> Satz gebraucht wird, mit Erklärung und neuem Beispiel. Unbekannte Wörter werden zu Karteikarten mit verteilter Wiederholung."

[ai.apps_heading]
