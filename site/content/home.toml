en = "A qubit on the Bloch sphere. Every gate is a rotation: H turns by π about (x+z)/√2 and T by π/4 about z. Measuring collapses the state to a pole with probability cos²(θ/2) or sin²(θ/2). Try H, then T, and measure a few times."
