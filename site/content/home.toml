# ---------- Portada ----------
[hero.kicker]
es = "Física · Información cuántica · IA"
en = "Physics · Quantum information · AI"
de = "Physik · Quanteninformation · KI"

[hero.title]
es = "Información cuántica, inteligencia artificial y <em>las herramientas</em> para estudiarlas."
en = "Quantum information, artificial intelligence and <em>the tools</em> to study them."
de = "Quanteninformation, künstliche Intelligenz und <em>die Werkzeuge</em>, um sie zu studieren."

[hero.affiliation]
es = "Física, Universidad Nacional de Colombia"
en = "Physics, Universidad Nacional de Colombia"
de = "Physik, Universidad Nacional de Colombia"

[hero.abstract_label]
es = "Resumen."
en = "Abstract."
de = "Zusammenfassung."

[hero.abstract_1]
es = "Estudio física en la Universidad Nacional de Colombia. Me interesa una pregunta que atraviesa dos campos: qué significa procesar información cuando el soporte es cuántico, y qué pueden aprender las máquinas cuando la información sobra."
en = "I study physics at the Universidad Nacional de Colombia. I'm drawn to a question that runs through two fields: what it means to process information when its carrier is quantum, and what machines can learn when information is everywhere."
de = "Ich studiere Physik an der Universidad Nacional de Colombia. Mich beschäftigt eine Frage, die zwei Felder durchzieht: Was bedeutet es, Information zu verarbeiten, wenn ihr Träger quantenmechanisch ist, und was können Maschinen lernen, wenn Information im Überfluss vorhanden ist?"

[hero.abstract_2]
es = 'Trabajo en dos frentes. Uno es la <a href="#quantum">teoría cuántica de la información</a>, que estudio de forma sistemática. El otro es la <a href="#ai">inteligencia artificial aplicada</a>, con la que construyo herramientas que no inventan datos. Algunas de esas herramientas acabaron siendo <a href="#software">apps nativas para macOS</a> que uso todos los días.'
en = '''I work on two fronts. One is <a href="#quantum">quantum information theory</a>, which I study systematically. The other is <a href="#ai">applied artificial intelligence</a>, which I use to build tools that don't make up data. Some of those tools ended up as <a href="#software">native macOS apps</a> I use every day.'''
de = 'Ich arbeite an zwei Fronten. Die eine ist die <a href="#quantum">Quanteninformationstheorie</a>, die ich systematisch lerne. Die andere ist <a href="#ai">angewandte künstliche Intelligenz</a>, mit der ich Werkzeuge baue, die keine Daten erfinden. Einige dieser Werkzeuge sind zu <a href="#software">nativen macOS-Apps</a> geworden, die ich jeden Tag benutze.'

