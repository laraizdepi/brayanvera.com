# ---------- §1 Información cuántica ----------
[quantum.heading]
es = "Información cuántica"
en = "Quantum information"
de = "Quanteninformation"

[quantum.lede]
es = 'La información es física<sup class="n">1</sup>. Un bit clásico vale 0 o 1. Un qubit es un vector unitario en un espacio de Hilbert de dimensión dos, y esa diferencia (superposición, interferencia y, sobre todo, entrelazamiento) cambia lo que es posible comunicar y calcular.'
en = 'Information is physical<sup class="n">1</sup>. A classical bit is either 0 or 1. A qubit is a unit vector in a two-dimensional Hilbert space, and that difference (superposition, interference and, above all, entanglement) changes what can be communicated and computed.'
de = 'Information ist physikalisch<sup class="n">1</sup>. Ein klassisches Bit ist 0 oder 1. Ein Qubit ist ein Einheitsvektor in einem zweidimensionalen Hilbertraum, und dieser Unterschied (Superposition, Interferenz und vor allem Verschränkung) verändert, was sich kommunizieren und berechnen lässt.'

[quantum.p2]
es = 'Estoy construyendo esa base de forma sistemática: el formalismo de estados y operadores, los circuitos cuánticos y los protocolos que usan el entrelazamiento como recurso. Mi ejemplo favorito es la teleportación. Con un par entrelazado y dos bits clásicos, un estado desconocido pasa de Alice a Bob sin que nadie llegue a conocerlo, y sin violar la relatividad: sin esos dos bits, lo que tiene Bob no le sirve de nada<sup class="n">2</sup>.'
en = '''I'm building that foundation systematically: the formalism of states and operators, quantum circuits, and the protocols that use entanglement as a resource. My favorite example is teleportation. With one entangled pair and two classical bits, an unknown state travels from Alice to Bob without anyone ever learning it, and without violating relativity: without those two bits, what Bob holds is of no use to him<sup class="n">2</sup>.'''
de = 'Diese Grundlage baue ich systematisch auf: den Formalismus von Zuständen und Operatoren, Quantenschaltkreise und die Protokolle, die Verschränkung als Ressource nutzen. Mein Lieblingsbeispiel ist die Teleportation. Mit einem verschränkten Paar und zwei klassischen Bits gelangt ein unbekannter Zustand von Alice zu Bob, ohne dass ihn jemals jemand erfährt, und ohne die Relativitätstheorie zu verletzen: Ohne diese zwei Bits nützt Bob sein Qubit nichts<sup class="n">2</sup>.'

[quantum.p3]
es = "Lo que más me atrae es el punto de encuentro con otras áreas. En la geometría y la topología, la computación cuántica topológica protege la información codificándola en propiedades globales que el ruido local no puede tocar. En la inteligencia artificial, cada campo puede servirle al otro de herramienta."
en = "What draws me most is where it meets other fields. With geometry and topology: topological quantum computing protects information by encoding it in global properties that local noise can't touch. With artificial intelligence: each field can serve the other as a tool."
de = "Am meisten reizt mich, wo sie auf andere Gebiete trifft. Auf Geometrie und Topologie: Topologisches Quantenrechnen schützt Information, indem es sie in globalen Eigenschaften kodiert, an die lokales Rauschen nicht herankommt. Auf künstliche Intelligenz: Jedes der beiden Felder kann dem anderen als Werkzeug dienen."

[quantum.note_1]
es = 'La frase es de Rolf Landauer: borrar un bit tiene un costo mínimo de energía, <span data-tex="k_B T \ln 2"></span>.'
en = '''The phrase is Rolf Landauer's: erasing one bit has a minimum energy cost, <span data-tex="k_B T \ln 2"></span>.'''
de = 'Der Satz stammt von Rolf Landauer: Das Löschen eines Bits kostet mindestens die Energie <span data-tex="k_B T \ln 2"></span>.'

[quantum.note_2]
es = "Que Alice pierda su copia no es un detalle del protocolo: el teorema de no clonación (Wootters y Zurek, 1982) impide copiar un estado cuántico desconocido."
en = "Alice losing her copy isn't a detail of the protocol: the no-cloning theorem (Wootters and Zurek, 1982) forbids copying an unknown quantum state."
de = "Dass Alice ihre Kopie verliert, ist kein Detail des Protokolls: Das No-Cloning-Theorem (Wootters und Zurek, 1982) verbietet es, einen unbekannten Quantenzustand zu kopieren."

